name: Unzip and Replace

# Trigger manually from the Actions tab, or automatically whenever
# paper-trading-agent-v2.zip is pushed to the repo.
on:
  workflow_dispatch:
  push:
    paths:
      - "paper-trading-agent-v2.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify zip exists
        run: |
          if [ ! -f "paper-trading-agent-v2.zip" ]; then
            echo "::error::paper-trading-agent-v2.zip not found at repo root."
            exit 1
          fi

      - name: Remove previous extracted folder
        run: |
          rm -rf paper-trading-agent-v2

      - name: Unzip archive
        run: |
          unzip -o paper-trading-agent-v2.zip -d .

      - name: Remove the zip file after extracting
        run: |
          rm -f paper-trading-agent-v2.zip

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-unzip: replace paper-trading-agent-v2 contents"
            git push
          fi
