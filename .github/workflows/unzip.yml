name: Unzip and Replace

# Trigger manually from the Actions tab, or automatically whenever
# any .zip file is pushed anywhere in the repo (handy for phone uploads,
# where the exact folder/filename can be inconsistent).
on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find zip file anywhere in repo
        id: findzip
        run: |
          # Grab the most recently modified .zip anywhere in the repo,
          # skipping .git internals.
          ZIP_PATH=$(find . -type f -iname "*.zip" -not -path "./.git/*" -printf "%T@ %p\n" \
            | sort -rn | head -n1 | cut -d' ' -f2-)

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::No .zip file found anywhere in the repo. Upload one via Add file > Upload files on GitHub, then re-run this workflow."
            exit 1
          fi

          echo "Found zip: $ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Remove previous extracted folder
        run: |
          # Adjust this name if your project folder is called something else.
          rm -rf paper-trading-agent-v2

      - name: Unzip archive
        run: |
          unzip -o "${{ steps.findzip.outputs.zip_path }}" -d .

      - name: Remove the zip file after extracting
        run: |
          rm -f "${{ steps.findzip.outputs.zip_path }}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-unzip: replace project contents from uploaded zip"
            git push
          fi
